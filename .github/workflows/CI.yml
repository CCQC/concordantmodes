name: CI
 
on:
  push:
    branches: [master]
  pull_request:
 
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
 
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # hatch-vcs reads the version from git tags
 
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
 
      - name: Install ConcordantModes with test and symmetry extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[tests,symmetry]" pytest-cov
 
      - name: Run tests
        run: pytest --cov=concordantmodes --cov-report=term-missing concordantmodes/tests
