name: Lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install black
        run: python -m pip install black==25.1.0  # pinned: the style changes between versions

      - name: Check formatting
        run: black --check concordantmodes
